# Mantém o sistema "acordado" no plano gratuito do Render.
# O Render desliga o servidor após 15 min sem acessos, e o próximo acesso
# demora ~50 s. Este robô acessa o site a cada 10 min, das 6h às 23h
# (horário de Brasília). De madrugada ele deixa dormir, para economizar
# as 750 horas grátis por mês do Render.
name: Manter sistema acordado

on:
  schedule:
    # Horários em UTC: 09:00–01:59 UTC = 06:00–22:59 em Brasília
    - cron: '*/10 9-23 * * *'
    - cron: '*/10 0-1 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acessar o sistema
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://agendamento-sede-campestre.onrender.com/api/config || true)
            echo "Tentativa $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "O sistema não respondeu (pode estar em manutenção no Render)."
